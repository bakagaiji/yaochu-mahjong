<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132b35">
  <meta name="description" content="么九牌だけで打つ、1人対CPU3人のオリジナル四人麻雀。リーチ・ポン・ロン・ツモ、東風戦をブラウザだけで楽しめます。">
  <title>么九麻雀｜端と字だけの四人麻雀</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="brand"><div class="brand-mark" aria-hidden="true">九</div><div><p class="brand-overline">TERMINALS & HONORS</p><h1>么九麻雀 <span>やおちゅうまーじゃん</span></h1></div></div>
      <div class="header-buttons"><button class="header-btn" data-action="help"><span aria-hidden="true">？</span> 遊び方</button><button class="header-btn muted" data-action="new-game">最初から</button></div>
    </header>
    <main class="game-layout">
      <div class="game-intro"><div><span class="section-kicker">EAST ROUND · FOUR PLAYERS</span><h2>端と字だけで、打ち合う。</h2><p>13種類・各8枚。全部のアガリが高打点。</p></div><div class="round-chip"><strong id="round-label">東1局</strong><span id="dealer-label">親：あなた</span></div></div>
      <section class="table-zone" aria-label="麻雀卓">
        <div id="opp-grid" class="opp-grid"></div>
        <div class="table-felt">
          <div class="felt-topline"><span class="felt-label">DISCARDS <span class="circle-marker"></span> 捨て牌</span><div class="center-stats"><span>残り <strong id="wall-count">52</strong> 枚</span><span>供託 <strong id="riichi-pot">0</strong> 点</span></div></div>
          <div id="river-grid" class="river-grid"></div>
        </div>
      </section>
      <section class="player-zone" aria-label="自分の手番">
        <div class="player-score"><div><span class="score-avatar" aria-hidden="true">人</span><div><span class="score-caption">PLAYER 01</span><strong>あなた</strong></div></div><div><strong id="my-score">25,000</strong><span>点</span></div></div>
        <div id="hand-panel" class="hand-panel"></div>
        <div id="notice" class="notice" role="status" aria-live="polite"></div>
      </section>
      <section class="log-zone"><div class="log-head"><span class="section-kicker">MATCH HISTORY</span><span>対局の記録</span></div><div id="logs" class="logs"></div></section>
    </main>
    <footer>© 么九麻雀 · ブラウザだけで遊べるオリジナル四人麻雀</footer>
  </div>
  <div id="overlays"></div>
</body>
</html>
