name: Publish Yaochu Mahjong v1.0.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.0.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'bakagaiji/yaochu-mahjong'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the exact completed-game revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > "${RUNNER_TEMP}/release-notes.md" <<'NOTES'
          # 么九麻雀 v1.0.0 — 決定版

          么九牌（数牌の一・九と字牌）13種類をそれぞれ12枚、合計156枚使うオリジナル四人麻雀の正式版です。あなた1人とCPU3人で東風戦を遊べます。

          ## 主な特徴
          - 156枚の三セット仕様、50,000点持ち。
          - 立直、ポン、暗槓・大明槓・加槓、ロン、ツモ。8カン流れにも対応。
          - ドラ、裏ドラ、カンドラ、カン裏ドラ、嶺上開花、槍槓。
          - 13翻ごとの数え役満の倍付け（26翻でダブル役満、39翻でトリプル役満）、複合役満。
          - 親の連荘、本場、流局、飛び終了。
          - ダブロン・トリロン対応（全員分を精算してから飛び判定）。
          - PC・スマートフォン対応。萬子・筒子・索子の統一デザインと、筒子の青い実線・索子の緑の破線。
          - ブラウザ内の自動保存、CPUとの対戦、アガリ手の公開。

          ## 遊ぶ
          - [個人サイト版](https://akkun.pages.dev/yaochu-mahjong/)
          - [GitHub Pages版](https://bakagaiji.github.io/yaochu-mahjong/)

          通常のリーチ麻雀とは異なるオリジナルルールを含みます。詳細はREADMEをご覧ください。

          このReleaseは決定版となったコミット `acc94de6227ab3196cbd0350e895607fdcde6ca1` を固定しています。公開サイトの変更や更新は、このRelease自体では行いません。
          NOTES
          if gh release view v1.0.0 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "v1.0.0 already exists, skipping."
            exit 0
          fi
          gh release create v1.0.0 \
            --repo "$GH_REPO" \
            --target "acc94de6227ab3196cbd0350e895607fdcde6ca1" \
            --title "么九麻雀 v1.0.0 — 決定版" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --latest
          gh release view v1.0.0 --repo "$GH_REPO" --json tagName,name,url,isLatest
